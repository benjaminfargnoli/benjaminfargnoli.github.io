# Site settings
title: Benjamin Fargnoli
email: bcfargnoli13@gmail.com
description: "Personal website of Benjamin C. Fargnoli - Mathematics at Georgia Tech, Biophysics at Emory"
url: "https://benjaminfargnoli.github.io"
baseurl: ""

# Theme
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "air"

# Build settings
markdown: kramdown

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-include-cache

# Disable features we don't need
search: false
breadcrumbs: false

# Author (for metadata)
author:
  name: "Benjamin Fargnoli"
  avatar: "/assets/images/headshot.jpg"
  bio: "Mathematics @ Georgia Tech | Biophysics @ Emory"

# Simplified footer
footer:
  links:
    - label: "X"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/BenjaminFargnol"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/benjaminfargnoli"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/in/benjaminfargnoli/"

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: splash
